<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Завдання 4 — StyledEmpTable</title>
  <script src="js/app.js"></script>
</head>
<body>
  <h1>Завдання 4. Стилізована таблиця працівників</h1>
  <div id="table"></div>
  <script>
    const employees = [
      new Employee(1, "Іваненко", "Олена", "Касир", "Відділення №1"),
      new Employee(2, "Петренко", "Андрій", "Менеджер", "Відділення №2"),
      new Employee(3, "Ковальчук", "Марія", "Бухгалтер", "Головний офіс"),
      new Employee(4, "Шевченко", "Олег", "Консультант", "Відділення №1")
    ];
    const table = new StyledEmpTable(employees);
    document.getElementById("table").innerHTML = table.getHtml();
  </script>
</body>
</html>
